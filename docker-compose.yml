services:
  # 1. PHP 8.4 / 8.3 FPM Application Container
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dot_pos_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - dot_pos_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dot_pos
      DB_USERNAME: dot_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080

  # 2. Nginx Reverse Proxy Web Server
  web:
    image: nginx:alpine
    container_name: dot_pos_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dot_pos_net
    depends_on:
      - app

  # 3. MySQL 8.0 Enterprise Relational Database
  db:
    image: mysql:8.0
    container_name: dot_pos_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: dot_pos
      MYSQL_USER: dot_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dot_pos_mysql_data:/var/lib/mysql
    networks:
      - dot_pos_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. Redis 7 High-Speed In-Memory Cache & Queue Engine
  redis:
    image: redis:7-alpine
    container_name: dot_pos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dot_pos_redis_data:/data
    networks:
      - dot_pos_net

  # 5. Laravel Reverb Real-Time WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dot_pos_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    networks:
      - dot_pos_net
    depends_on:
      - app
      - redis

  # 6. Node.js Asynchronous Microservice Worker (Receipt & Barcode Daemon)
  node-worker:
    build:
      context: ./services/node-worker
      dockerfile: Dockerfile
    container_name: dot_pos_node_worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./services/node-worker:/app
      - /app/node_modules
    networks:
      - dot_pos_net
    depends_on:
      - redis
    environment:
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379

networks:
  dot_pos_net:
    driver: bridge

volumes:
  dot_pos_mysql_data:
    driver: local
  dot_pos_redis_data:
    driver: local
